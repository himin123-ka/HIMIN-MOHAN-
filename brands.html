<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Brand Stories | Himin Mohan</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;500&family=Nunito+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #f4f3f0;
  color: #171716;
  font-family: 'Nunito Sans', sans-serif;
  font-weight: 300;
}

header {
  padding: 25px 7%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid rgba(23,23,22,.12);
}

.logo {
  font-family: 'Josefin Sans', sans-serif;
  font-size: 17px;
  letter-spacing: 3px;
  color: #171716;
  text-decoration: none;
}

.back {
  font-size: 13px;
  color: #79716a;
  text-decoration: none;
}

.hero {
  text-align: center;
  padding: 90px 20px 65px;
}

.eyebrow {
  font-size: 11px;
  letter-spacing: 4px;
  text-transform: uppercase;
  margin-bottom: 22px;
  color: #a68b65;
}

h1 {
  font-family: 'Josefin Sans', sans-serif;
  font-size: clamp(38px, 6vw, 62px);
  font-weight: 300;
  letter-spacing: 2px;
}

.line {
  width: 48px;
  height: 1px;
  background: #a68b65;
  margin: 25px auto;
}

.intro {
  max-width: 550px;
  margin: auto;
  font-size: 14px;
  line-height: 1.9;
  color: #77736e;
}

.brand-grid {
  max-width: 1150px;
  margin: auto;
  padding: 15px 7% 100px;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 35px 25px;
}

.brand-card {
  display: block;
  color: inherit;
  text-decoration: none;
}

.cover {
  width: 100%;
  aspect-ratio: 4 / 5;
  background: #e9e6df;
  overflow: hidden;
  position: relative;
}

.cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform .6s ease;
}

.brand-card:hover .cover img {
  transform: scale(1.035);
}

.placeholder {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #a68b65;
  font-family: 'Josefin Sans', sans-serif;
  font-size: 13px;
  letter-spacing: 3px;
}

.brand-name {
  font-family: 'Josefin Sans', sans-serif;
  font-size: 19px;
  font-weight: 400;
  letter-spacing: 1px;
  margin-top: 19px;
}

.brand-category {
  font-size: 12px;
  color: #89837b;
  margin-top: 8px;
}

footer {
  border-top: 1px solid rgba(23,23,22,.12);
  text-align: center;
  padding: 28px 15px;
  font-size: 11px;
  letter-spacing: 2px;
  color: #89837b;
}

@media (max-width: 600px) {
  header {
    padding: 21px 5%;
  }

  .hero {
    padding: 70px 20px 50px;
  }

  .brand-grid {
    grid-template-columns: 1fr;
    padding: 10px 6% 70px;
    gap: 30px;
  }
}
</style>
</head>

<body>

<header>
  <a href="index.html" class="logo">HIMIN MOHAN</a>
  <a href="index.html" class="back">← Portfolio</a>
</header>

<section class="hero">
  <p class="eyebrow">Fashion & Collaboration</p>
  <h1>Brand Stories</h1>
  <div class="line"></div>
  <p class="intro">
    A collection of fashion collaborations, creative stories
    and visual moments captured through my lens.
  </p>
</section>

<main class="brand-grid" id="brandGrid"></main>

<footer>
  © HIMIN MOHAN PHOTOGRAPHY
</footer>

<script>

// ADD NEW BRANDS HERE IN THE FUTURE

const brands = [
  {
    name: "Madurai Rani",
    category: "Fashion Collaboration",
    cover: "",
    page: "brand.html?brand=madurai-rani"
  }

];

// DISPLAY ALL BRANDS

const grid = document.getElementById("brandGrid");

brands.forEach(brand => {

  const card = document.createElement("a");
  card.className = "brand-card";
  card.href = brand.page;

  const cover = brand.cover
    ? <img src="${brand.cover}" alt="${brand.name}">
    : <div class="placeholder">PHOTOGRAPHY</div>;

  card.innerHTML = `
    <div class="cover">
      ${cover}
    </div>
    <h2 class="brand-name">${brand.name}</h2>
    <p class="brand-category">${brand.category}</p>
  `;

  grid.appendChild(card);

});

</script>

</body>
</html>
